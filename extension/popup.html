<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Recommendation Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <header class="popup-header">
        <div class="brand-row">
          <img
            src="icons/icon32.png"
            alt="YouTube Recommendation Blocker icon"
            width="24"
            height="24"
            class="brand-icon"
          />
          <h1 class="brand-title">YouTube Recommendation Blocker</h1>
        </div>
      </header>

      <section class="control-card" aria-label="Extension controls">
        <div class="control-row">
          <div class="control-copy">
            <label for="toggle-blocking" class="control-label">
              Block recommendations
            </label>
            <p class="status-line">
              Status:
              <span id="status-indicator" class="status-text" data-state="on">ON</span>
            </p>
          </div>

          <label class="switch" for="toggle-blocking">
            <input
              type="checkbox"
              id="toggle-blocking"
              role="switch"
              aria-checked="true"
              aria-label="Block recommendations"
              checked
            />
            <span class="switch-track" aria-hidden="true">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <p class="scope-note">
          Hides homepage video feed and watch page right-sidebar suggestions.
        </p>
      </section>

      <footer class="popup-footer">
        <p class="privacy-message">Your settings stay on your device.</p>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
